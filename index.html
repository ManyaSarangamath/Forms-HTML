<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novell Services Login</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <h1>Novell Services Login</h1>

        <form>

            <!-- Username -->
            <div class="form-row">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">
            </div>

            <!-- Password -->
            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </div>

            <!-- City -->
            <div class="form-row">
                <label for="city">City of<br>Employment:</label>
                <input type="text" id="city" name="city">
            </div>

            <!-- Web Server -->
            <div class="form-row">
                <label for="server">Web server:</label>

                <select id="server" name="server">
                    <option value="">— Choose a server —</option>
                    <option value="apache">Apache</option>
                    <option value="nginx">Nginx</option>
                    <option value="iis">IIS</option>
                </select>
            </div>

            <!-- Role -->
            <div class="form-row role-row">

                <label>Please specify<br>your role:</label>

                <div class="options">

                    <label>
                        <input type="radio" name="role" value="admin">
                        Admin
                    </label>

                    <label>
                        <input type="radio" name="role" value="engineer">
                        Engineer
                    </label>

                    <label>
                        <input type="radio" name="role" value="manager">
                        Manager
                    </label>

                    <label>
                        <input type="radio" name="role" value="guest">
                        Guest
                    </label>

                </div>
            </div>

            <!-- Single Sign-on -->
            <div class="form-row signon-row">

                <label>Single Sign-on<br>to the following:</label>

                <div class="options">

                    <label>
                        <input type="checkbox" name="service" value="mail">
                        Mail
                    </label>

                    <label>
                        <input type="checkbox" name="service" value="payroll">
                        Payroll
                    </label>

                    <label>
                        <input type="checkbox" name="service" value="self-service">
                        Self-service
                    </label>

                </div>
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button type="submit">Login</button>

                <button type="reset">Reset</button>

            </div>

        </form>

    </div>

</body>
</html>
